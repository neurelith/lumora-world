<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumora World — Coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&family=Lexend:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B2A33;
    --muted: #6B6875;
    --paper: #F4F2F6;
    --hairline: #E4E1E8;
    --amber: #E8A33D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Lexend', -apple-system, sans-serif;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 56px;
    text-align: center;
  }
  .brandrow {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 36px;
  }
  .brand-logo {
    height: 68px;
    width: auto;
    display: block;
    object-fit: contain;
  }
  .headline {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 42px;
    line-height: 1.28;
    letter-spacing: -0.01em;
    margin: 0 0 16px;
  }
  .headline .accent { color: var(--amber); }
  .subhead {
    font-size: 18px;
    color: var(--muted);
    margin: 0 0 48px;
  }
  .hero-visual { max-width: 640px; margin: 0 auto; }
  .hero-visual svg { width: 100%; height: auto; display: block; }
  .legend {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin: 20px 0 52px;
  }
  .divider { height: 1px; background: var(--hairline); margin: 0 0 40px; }
  .soon {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 16px;
  }
  .progress {
    width: 240px;
    height: 6px;
    background: var(--hairline);
    border-radius: 999px;
    margin: 0 auto 18px;
    overflow: hidden;
  }
  .progress-fill { width: 38%; height: 100%; background: var(--amber); border-radius: inherit; }
  .footnote { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  .honest { font-size: 13px; color: var(--muted); opacity: 0.85; margin: 0; }
  @media (max-width: 480px) {
    .headline { font-size: 30px; }
    .subhead { font-size: 16px; }
  }
</style>
</head>
<body>
<main class="wrap">

  <header class="brandrow">
    <img src="lumora_logo_transparent.png" alt="Lumora World" class="brand-logo">
  </header>

  <h1 class="headline"><span class="accent">Five worlds</span> of learning<br>are coming to your classroom.</h1>
  <p class="subhead">One tablet. No specialist required.</p>

  <div class="hero-visual">
    <svg viewBox="0 0 640 460" role="img" aria-label="An open book glowing with light, surrounded by five icons for Sound Forest, Rune Realm, Vision Valley, Story Castle, and Memory Mountains">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <ellipse cx="320" cy="170" rx="170" ry="110" fill="url(#glow)"/>

      <line x1="320" y1="188" x2="300" y2="140" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <line x1="320" y1="188" x2="320" y2="128" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <line x1="320" y1="188" x2="340" y2="140" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

      <line x1="110" y1="110" x2="190" y2="255" stroke="#2F5D50" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.4"/>
      <line x1="90" y1="240" x2="190" y2="255" stroke="#2FA8A0" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.4"/>
      <line x1="110" y1="370" x2="190" y2="255" stroke="#3E8FB0" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.4"/>
      <line x1="530" y1="150" x2="450" y2="255" stroke="#3E4C7A" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.4"/>
      <line x1="530" y1="330" x2="450" y2="255" stroke="#4F5D75" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.4"/>

      <g>
        <polygon points="320,190 185,215 195,315 320,295" fill="#FFFFFF" stroke="#2B2A33" stroke-width="1.6" stroke-linejoin="round"/>
        <polygon points="320,190 455,215 445,315 320,295" fill="#FFFFFF" stroke="#2B2A33" stroke-width="1.6" stroke-linejoin="round"/>
        <line x1="320" y1="188" x2="320" y2="297" stroke="#2B2A33" stroke-width="2.4"/>
        <g stroke="#6B6875" stroke-width="1.4" opacity="0.55" stroke-linecap="round">
          <line x1="215" y1="242" x2="288" y2="238"/>
          <line x1="213" y1="258" x2="290" y2="254"/>
          <line x1="211" y1="274" x2="292" y2="270"/>
          <line x1="209" y1="290" x2="294" y2="286"/>
          <line x1="352" y1="238" x2="425" y2="242"/>
          <line x1="350" y1="254" x2="427" y2="258"/>
          <line x1="348" y1="270" x2="429" y2="274"/>
          <line x1="346" y1="286" x2="431" y2="290"/>
        </g>
      </g>

      <g transform="translate(470,300)" opacity="0.9">
        <path d="M-13,10 C-13,-5 -6,-15 0,-15 C6,-15 13,-5 13,10 C13,16 7,18 0,18 C-7,18 -13,16 -13,10 Z" fill="#2B2A33"/>
        <polygon points="-9,-13 -13,-23 -3,-17" fill="#2B2A33"/>
        <polygon points="9,-13 13,-23 3,-17" fill="#2B2A33"/>
      </g>

      <g transform="translate(110,110)">
        <circle r="32" fill="#2F5D50" fill-opacity="0.1" stroke="#2F5D50" stroke-opacity="0.5" stroke-width="1.5"/>
        <g stroke="#2F5D50" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="0" cy="0" rx="9" ry="14" transform="rotate(45)"/>
          <line x1="-6" y1="8" x2="6" y2="-8"/>
        </g>
        <text x="0" y="52" text-anchor="middle" font-size="13" fill="#2B2A33" font-family="Lexend, sans-serif">Sound Forest</text>
      </g>

      <g transform="translate(90,240)">
        <circle r="32" fill="#2FA8A0" fill-opacity="0.1" stroke="#2FA8A0" stroke-opacity="0.5" stroke-width="1.5"/>
        <g stroke="#2FA8A0" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="-8" y1="-8" x2="8" y2="8"/>
          <line x1="8" y1="-8" x2="-8" y2="8"/>
          <line x1="0" y1="-11" x2="0" y2="11"/>
        </g>
        <text x="0" y="52" text-anchor="middle" font-size="13" fill="#2B2A33" font-family="Lexend, sans-serif">Rune Realm</text>
      </g>

      <g transform="translate(110,370)">
        <circle r="32" fill="#3E8FB0" fill-opacity="0.1" stroke="#3E8FB0" stroke-opacity="0.5" stroke-width="1.5"/>
        <g stroke="#3E8FB0" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-14,0 C-8,-10 8,-10 14,0 C8,10 -8,10 -14,0 Z"/>
          <circle cx="0" cy="0" r="4"/>
        </g>
        <text x="0" y="52" text-anchor="middle" font-size="13" fill="#2B2A33" font-family="Lexend, sans-serif">Vision Valley</text>
      </g>

      <g transform="translate(530,150)">
        <circle r="32" fill="#3E4C7A" fill-opacity="0.1" stroke="#3E4C7A" stroke-opacity="0.5" stroke-width="1.5"/>
        <g stroke="#3E4C7A" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="-8" y="-4" width="16" height="18"/>
          <polygon points="-10,-4 10,-4 0,-16"/>
          <rect x="-3" y="2" width="6" height="6"/>
        </g>
        <text x="0" y="52" text-anchor="middle" font-size="13" fill="#2B2A33" font-family="Lexend, sans-serif">Story Castle</text>
      </g>

      <g transform="translate(530,330)">
        <circle r="32" fill="#4F5D75" fill-opacity="0.1" stroke="#4F5D75" stroke-opacity="0.5" stroke-width="1.5"/>
        <g stroke="#4F5D75" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="-14,10 -4,-8 4,10"/>
          <polygon points="-2,10 8,-6 16,10"/>
          <circle cx="10" cy="-12" r="3"/>
        </g>
        <text x="0" y="52" text-anchor="middle" font-size="12.5" fill="#2B2A33" font-family="Lexend, sans-serif">Memory Mountains</text>
      </g>
    </svg>
  </div>

  <p class="legend">Sound Forest · Story Castle · Rune Realm · Memory Mountains · Vision Valley</p>

  <div class="divider"></div>

  <p class="soon">Coming soon</p>
  <div class="progress"><div class="progress-fill"></div></div>
  <p class="footnote">Stay tuned. Every world is being built with care.</p>
  <p class="honest">Simple, transparent rules — not a black box.</p>

</main>
</body>
</html>

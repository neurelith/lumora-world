<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Ambient Lantern Halo Glow -->
    <radialGradient id="dyuti-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Lantern Top Cap & Base Gold Gradient -->
    <linearGradient id="dyuti-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="45%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <!-- Inner Luminous Flame Spark -->
    <linearGradient id="dyuti-spark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Glass Chamber Gradient -->
    <linearGradient id="dyuti-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0.65" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dyuti-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D97706" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Soft Aura -->
  <circle cx="60" cy="62" r="52" fill="url(#dyuti-halo)" />

  <!-- Outer Lantern Silhouette with Shadow -->
  <g filter="url(#dyuti-shadow)">
    <!-- Top Hanging Ring -->
    <circle cx="60" cy="18" r="9" stroke="url(#dyuti-cap)" stroke-width="4.5" fill="none" />

    <!-- Top Cap Dome -->
    <path d="M38 34 C38 27, 82 27, 82 34 L88 42 C88 44, 32 44, 32 42 Z" fill="url(#dyuti-cap)" />
    <!-- Cap Rim Accent -->
    <rect x="30" y="41" width="60" height="5" rx="2.5" fill="#FBBF24" />

    <!-- Lantern Glass Body -->
    <path d="M34 46 L38 86 C39 90, 81 90, 82 86 L86 46 Z" fill="url(#dyuti-glass)" stroke="#FCD34D" stroke-width="2" />

    <!-- Central Glowing Core (Dyuti) -->
    <g transform="translate(60, 66)">
      <!-- Flame Spark Shape -->
      <path d="M0 -18 C6 -8, 14 0, 14 8 C14 16, 8 20, 0 20 C-8 20, -14 16, -14 8 C-14 0, -6 -8, 0 -18 Z" fill="url(#dyuti-spark)" />
      <!-- Inner Bright Core -->
      <ellipse cx="0" cy="8" rx="6" ry="8" fill="#FFFFFF" opacity="0.9" />
      <!-- Radiating Sparkle Star -->
      <path d="M0 -7 L2 -1 L8 0 L2 1 L0 7 L-2 1 L-8 0 L-2 -1 Z" fill="#FFFFFF" />
    </g>

    <!-- Side Protective Cages -->
    <path d="M34 46 Q44 66 38 86" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75" />
    <path d="M86 46 Q76 66 82 86" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75" />

    <!-- Base Pedestal -->
    <path d="M36 88 L34 96 C34 99, 86 99, 86 96 L84 88 Z" fill="url(#dyuti-cap)" />
    <!-- Bottom Rim -->
    <rect x="32" y="95" width="56" height="5" rx="2.5" fill="#C2410C" />
  </g>
</svg>
